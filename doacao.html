<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação — FramptSolutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.min.css">
</head>

<body>

    <header class="container">
        <img src="imagem/logo.png" alt="Logo da empresa" class="logo">
        <h1>Registro de Doação</h1>
        <button id="temaBtn" aria-label="Alternar tema">🌙</button>
        <nav>
            <ul class="menu">
                <li class="dropdown dropdown-paginas">
                    <a href="#" id="btnPaginas">Páginas ▼</a>
                    <ul class="submenu submenu-paginas" id="submenuPaginas">
                        <li><a href="login.html">Login</a></li>
                        <li><a href="solicitacao.html">Solicitação</a></li>
                        <li><a href="doacao.html">Doação</a></li>
                        <li><a href="configuracoes.html">Configurações</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">

        <section>
            <h2>Nova Doação</h2>

            <form id="formDoacao" class="form-solicitacao">
                <div class="form-group full">
                    <label for="produtoIdDoacao">Produto</label>
                    <select id="produtoIdDoacao" name="produto" required>
                        <option value="">Carregando produtos...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="qtdDoacao">Quantidade</label>
                    <input type="number" id="qtdDoacao" name="quantidade" placeholder="0" min="1" max="12" required>
                </div>

                <div class="form-group">
                    <label for="validadeDoacao">Validade do Produto</label>
                    <input type="date" id="validadeDoacao" name="validade">
                </div>

                <div class="form-group">
                    <label for="origemDoacao">Origem</label>
                    <input type="text" id="origemDoacao" name="origem" placeholder="Ex: Clínica Vida+">
                </div>

                <div class="form-group full">
                    <label for="obsDoacao">Observações</label>
                    <textarea id="obsDoacao" name="observacao" placeholder="Informações adicionais sobre a doação"
                        rows="3"></textarea>
                </div>

                <div class="form-group full">
                    <button type="submit" class="btn-enviar-solicitacao">Registrar Doação</button>
                </div>
            </form>

            <p id="msgDoacao"></p>
        </section>

        <section>
            <h2>Minhas Doações</h2>
            <div class="table-responsive">
                <table id="tabelaDoacoes">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Origem</th>
                            <th>Data</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 FramptSolutions</p>
        <p>Desenvolvido por: FS</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/notificacao.js"></script>
    <script src="js/script.js"></script>
    <script src="js/doacao.js"></script>

</body>

</html>
