<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — FramptSolutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.min.css">
</head>

<body>

    <header class="container">
        <img src="imagem/logo.png" alt="Logo da empresa" class="logo">
        <h1>Cadastro de Produtos</h1>
        <button id="temaBtn" aria-label="Alternar tema">🌙</button>
        <nav>
            <ul class="menu">
                
                <li class="dropdown dropdown-paginas">
                    <a href="#" id="btnPaginas">Páginas ▼</a>
                    <ul class="submenu submenu-paginas" id="submenuPaginas">
                        <li><a href="login.html">Login</a></li>
                        <li><a href="cadastro.html">Cadastro de Produtos</a></li>
                        <li><a href="solicitacao.html">Solicitação</a></li>
                        <li><a href="relatorio.html">Relatório</a></li>
                        <li><a href="painel.html">Painel</a></li>
                        <li><a href="configuracoes.html">Configurações</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section>
            <div class="aba-conteudo ativo" id="aba-produto">
                <h3>Cadastro do Produto</h3>
                <form id="formProduto">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label for="nomeProduto">Nome do Produto</label>
                            <input type="text" id="nomeProduto" name="nome" placeholder="Ex: Dipirona 500mg" required>
                            <small style="opacity:0.6;">Digite o nome comercial ou genérico do medicamento</small>
                        </div>
                        <div class="form-group">
                            <label for="estadoProduto">Estado</label>
                            <select id="estadoProduto" name="estado">
                                <option value="">Selecione...</option>
                                <option value="Comprimido">Comprimido</option>
                                <option value="Capsula">Cápsula</option>
                                <option value="Liquido">Líquido</option>
                                <option value="Pomada">Pomada</option>
                                <option value="Injetavel">Injetável</option>
                                <option value="Xarope">Xarope</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="validadeProduto">Validade</label>
                            <input type="date" id="validadeProduto" name="validade">
                        </div>
                        <div class="form-group">
                            <label for="qtdProduto">Quantidade Disponível</label>
                            <input type="number" id="qtdProduto" name="quantidade" placeholder="0" min="0">
                        </div>
                        <div class="form-group">
                            <label for="origemProduto">Origem da Doação</label>
                            <input type="text" id="origemProduto" name="origem" placeholder="Ex: Clínica Vida+">
                        </div>
                        <div class="form-group">
                            <label for="outrasInfos">Outras Informações</label>
                            <input type="text" id="outrasInfos" name="outras" placeholder="Observações">
                        </div>
                        <div class="form-group">
                            <label>Foto do Produto</label>
                            <div class="foto-box" id="fotoBox">📷</div>
                            <input type="file" id="fotoInput" accept="image/*" style="display:none">
                        </div>
                    </div>
                    <div class="btn-acoes">
                        <button type="submit" class="btn-salvar">Salvar</button>
                        <button type="reset" class="btn-limpar">Limpar campos</button>
                        <button type="button" class="btn-cancelar" id="btnCancelarProduto">Cancelar/Voltar</button>
                    </div>
                </form>
            </div>
            <p id="msgCadastro"></p>
        </section>
    </main>

    <footer>
        <p>© 2026 FramptSolutions</p>
        <p>Desenvolvido por: FS</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/notificacao.js"></script>
    <script src="js/script.js"></script>
    <script src="js/cadastro.js"></script>
</body>

</html>
